plugins {
    id 'java-library'
}

ext.upstreamPlaywrightVersion = '1.59.0'

def upstreamSourcesDir = layout.buildDirectory.dir('generated/sources/upstream-playwright-java')

configurations {
    upstreamPlaywrightSources {
        transitive = false
    }
}

dependencies {
    upstreamPlaywrightSources "com.microsoft.playwright:playwright:${upstreamPlaywrightVersion}:sources"

    api project(':playwright4j')
    api 'com.google.code.gson:gson:2.13.1'
    api 'org.java-websocket:Java-WebSocket:1.6.0'
    api 'org.junit.jupiter:junit-jupiter-api:5.13.1'
    api 'org.junit.platform:junit-platform-commons:1.13.1'
    api 'org.opentest4j:opentest4j:1.3.0'
    runtimeOnly 'org.slf4j:slf4j-simple:2.0.17'

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.13.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.13.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.13.1'
}

tasks.register('unpackUpstreamPlaywrightJavaSources', Copy) {
    from { zipTree(configurations.upstreamPlaywrightSources.singleFile) }
    into upstreamSourcesDir
}

sourceSets {
    main {
        java {
            srcDir upstreamSourcesDir
        }
    }
}

tasks.named('compileJava') {
    dependsOn tasks.named('unpackUpstreamPlaywrightJavaSources')
}

test {
    systemProperty 'playwright4j.officialApiSpike', findProperty('playwright4j.officialApiSpike') ?: 'false'
    systemProperty 'playwright4j.chrome.executablePath', findProperty('playwright4j.chrome.executablePath') ?: ''
}
