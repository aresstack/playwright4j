name: Release to Maven Central

# Publish is pure Gradle via the Sonatype Central Portal (com.gradleup.nmcp), like
# aresstack/msdos-game-browser, on Windows because the release gate drives the
# installed Chrome, Edge and Firefox there. Triggered by a `v*` tag; version is derived from the tag.
#
# Release gate = the Chrome + Edge channel smokes (launch -> page -> evaluate -> close) plus the
# Firefox smoke over WebDriver BiDi (moz-firefox; context lifecycle and process exit), and the full
# upstream Playwright Java suite (upstream-gate) for Chrome, Edge and Firefox on Windows and Chrome
# and Firefox on Linux, in eight shards per browser: green iff exactly the failures listed in
# playwright-java-contract-tests/known-limitations/ fail (see problems.md). All are mandatory; a
# missing browser fails the release.
#
# Org secrets used: CENTRAL_USERNAME, CENTRAL_PASSWORD, GPG_PRIVATE_KEY, GPG_PASSPHRASE.
#
# Dry run: a manual workflow_dispatch, or a pull request that touches this file, runs every gate
# and the local publishToMavenLocal sanity step, but never publishes. Only a `v*` tag push
# reaches the Central Portal step.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'playwright4j/build.gradle'
      - 'build.gradle'
      - 'consumer-check/**'
      - 'playwright-java-contract-tests/known-limitations/**'

jobs:
  # The suite runs in eight shards per browser (-Pplaywright4j.shard) so each job stays short;
  # upstream-gate-check then evaluates the known limitations over the results of all shards.
  upstream-gate:
    name: Upstream suite (${{ matrix.config.os }}, ${{ matrix.config.channel }}, ${{ matrix.shard }}/8)
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: windows-2022, browser: chromium, channel: chrome }
          - { os: windows-2022, browser: chromium, channel: msedge }
          - { os: windows-2022, browser: firefox, channel: moz-firefox }
          - { os: ubuntu-24.04, browser: chromium, channel: chrome }
          - { os: ubuntu-24.04, browser: firefox, channel: moz-firefox }
        shard: [1, 2, 3, 4, 5, 6, 7, 8]

    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS: "1"

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # Playwright's moz-firefox channel looks for Firefox at /snap/bin/firefox on Linux; the runner
      # installs it elsewhere.
      - name: Point the moz-firefox channel at the installed Firefox (Linux)
        if: runner.os == 'Linux' && matrix.config.browser == 'firefox'
        run: |
          firefox --version
          sudo mkdir -p /snap/bin
          sudo ln -sf "$(readlink -f "$(command -v firefox)")" /snap/bin/firefox

      - name: Upstream suite, shard ${{ matrix.shard }}/8
        shell: bash
        run: ./gradlew :playwright-java-contract-tests:upstreamTestKnownLimitations -Pplaywright4j.browser=${{ matrix.config.browser }} -Pplaywright4j.browserChannel=${{ matrix.config.channel }} -Pplaywright4j.shard=${{ matrix.shard }}/8 --no-daemon --stacktrace

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-gate-${{ matrix.config.os }}-${{ matrix.config.channel }}-${{ matrix.shard }}
          path: |
            playwright-java-contract-tests/build/reports/tests/upstreamTestKnownLimitations/**
            playwright-java-contract-tests/build/test-results/upstreamTestKnownLimitations/**

  upstream-gate-check:
    name: Upstream gate (${{ matrix.os }}, ${{ matrix.channel }})
    needs: upstream-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, browser: chromium, channel: chrome }
          - { os: windows-2022, browser: chromium, channel: msedge }
          - { os: windows-2022, browser: firefox, channel: moz-firefox }
          - { os: ubuntu-24.04, browser: chromium, channel: chrome }
          - { os: ubuntu-24.04, browser: firefox, channel: moz-firefox }

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Collect the results of all shards
        uses: actions/download-artifact@v4
        with:
          pattern: upstream-gate-${{ matrix.os }}-${{ matrix.channel }}-*
          path: playwright-java-contract-tests/build
          merge-multiple: true

      - name: Known limitations over the whole suite
        shell: bash
        run: ./gradlew :playwright-java-contract-tests:knownLimitationsCheck -x :playwright-java-contract-tests:upstreamTestKnownLimitations -Pplaywright4j.browser=${{ matrix.browser }} -Pplaywright4j.browserChannel=${{ matrix.channel }} --no-daemon --stacktrace

  publish:
    needs: upstream-gate-check
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read

    env:
      BROWSER: chromium
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS: "1"

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Derive version from tag
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dryrun" >> "$GITHUB_OUTPUT"
          fi

      - name: Release gate — Chrome smoke
        shell: pwsh
        env:
          BROWSER_CHANNEL: chrome
        run: ./gradlew.bat :playwright-java-contract-tests:channelSmoke --no-daemon --stacktrace

      - name: Release gate — Edge smoke
        shell: pwsh
        env:
          BROWSER_CHANNEL: msedge
        run: ./gradlew.bat :playwright-java-contract-tests:channelSmoke --rerun-tasks --no-daemon --stacktrace

      - name: Locate installed Firefox (fail if missing)
        shell: pwsh
        run: |
          $candidates = @(
            "$env:ProgramFiles\Mozilla Firefox\firefox.exe",
            "${env:ProgramFiles(x86)}\Mozilla Firefox\firefox.exe"
          )
          $exe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) {
            Write-Error "Firefox is not installed on this runner; the Firefox release gate cannot run."
            exit 1
          }
          (Get-Item $exe).VersionInfo.ProductVersion | ForEach-Object { Write-Host "Firefox $_ at $exe" }
          "FIREFOX_EXECUTABLE=$exe" >> $env:GITHUB_ENV

      - name: Release gate — Firefox smoke (moz-firefox, WebDriver BiDi)
        shell: pwsh
        env:
          PLAYWRIGHT4J_REQUIRE_FIREFOX: "true"
        run: ./gradlew.bat :playwright-java-contract-tests:firefoxSmoke --rerun-tasks --no-daemon --stacktrace

      - name: Report leftover Firefox processes
        if: always()
        shell: pwsh
        run: |
          $left = Get-Process firefox -ErrorAction SilentlyContinue
          if ($left) { $left | Format-Table Id, StartTime, Path -AutoSize; $left | Stop-Process -Force }
          else { Write-Host "No Firefox processes left." }

      - name: Sanity — assemble publishable artifacts locally
        shell: pwsh
        run: ./gradlew.bat :playwright4j:publishToMavenLocal "-Pversion=${{ steps.ver.outputs.version }}" --no-daemon --stacktrace

      - name: Verify published artifacts contain no native binaries and no driver-bundle dependency
        shell: pwsh
        run: |
          $dir = "$env:USERPROFILE\.m2\repository\com\aresstack\playwright4j\${{ steps.ver.outputs.version }}"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $failed = $false
          foreach ($jar in Get-ChildItem $dir -Filter *.jar) {
            $zip = [System.IO.Compression.ZipFile]::OpenRead($jar.FullName)
            $bad = $zip.Entries | Where-Object { $_.FullName -match '(?i)(\.(exe|dll|so|dylib|jnilib)$|(^|/)node$)' } | ForEach-Object { $_.FullName }
            $zip.Dispose()
            if ($bad) { Write-Host "Native binaries in $($jar.Name):"; $bad | ForEach-Object { Write-Host "  $_" }; $failed = $true }
            else { Write-Host "OK: $($jar.Name)" }
          }
          $pom = Get-ChildItem $dir -Filter *.pom | Select-Object -First 1
          if (Select-String -Path $pom.FullName -Pattern 'driver-bundle' -Quiet) { Write-Host "POM depends on driver-bundle (ships Node.js binaries)"; $failed = $true }
          if ($failed) { exit 1 }

      - name: Consumer check — Gradle resolution (no Node driver, no native binaries in the jar)
        shell: pwsh
        run: ./gradlew.bat -p consumer-check checkConsumerDependencies "-Pplaywright4jVersion=${{ steps.ver.outputs.version }}" --no-daemon --stacktrace

      - name: Consumer check — Maven resolves the published POM (no Node driver)
        shell: pwsh
        run: mvn -B -f consumer-check/pom.xml verify "-Dplaywright4j.version=${{ steps.ver.outputs.version }}"

      - name: Build + sign + publish to Sonatype Central Portal
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          ORG_GRADLE_PROJECT_centralUsername: ${{ secrets.CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_centralPassword: ${{ secrets.CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
        run: ./gradlew.bat "-Pversion=${{ steps.ver.outputs.version }}" --no-daemon -x test publishAggregationToCentralPortal
