name: diag-tmp
on:
  push:
    branches: [claude/project-thread-g2gyvk]
permissions:
  contents: read
  checks: write
jobs:
  diag:
    name: diag ${{ matrix.name }}
    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: probe
            command: sleep 300
    env:
      GH_TOKEN: ${{ github.token }}
      DIAG_NAME: ${{ matrix.name }}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: gradle }
      - shell: bash
        run: |
          pwsh -NoProfile -File .github/diag/monitor.ps1 > "$RUNNER_TEMP/monitor.out" 2>&1 &
          ${{ matrix.command }}
      - if: always()
        shell: pwsh
        run: |
          Get-Content "$env:RUNNER_TEMP/metrics.txt", "$env:RUNNER_TEMP/monitor.out", "$env:RUNNER_TEMP/monitor.err", "$env:RUNNER_TEMP/metrics.json" -ErrorAction SilentlyContinue
          gh api -X PATCH "repos/$env:GITHUB_REPOSITORY/check-runs/$(Get-Content (Join-Path $env:RUNNER_TEMP 'metrics-id.txt'))" -f status=completed -f conclusion=neutral --silent
