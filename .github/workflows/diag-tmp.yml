name: diag-tmp
on:
  push:
    branches: [claude/project-thread-g2gyvk]
permissions:
  contents: read
jobs:
  diag:
    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        repeat: [1, 2, 3, 4]
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS: "1"
      JAVA_TOOL_OPTIONS: "-Xmx2g -XX:+ExitOnOutOfMemoryError"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: gradle }
      - shell: bash
        run: ./gradlew :playwright-java-contract-tests:knownLimitationsCheck -Pplaywright4j.browser=chromium -Pplaywright4j.browserChannel=chrome --no-daemon
