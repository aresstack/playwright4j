name: diag-tmp
on:
  push:
    branches: [claude/project-thread-g2gyvk]
permissions:
  contents: read
jobs:
  diag:
    runs-on: windows-2022
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        driver: [ours, official]
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS: "1"
      DEBUG: pw:protocol,pw:api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: gradle }
      - shell: bash
        run: |
          extra=""; [ "${{ matrix.driver }}" = official ] && extra="-Pplaywright4j.referenceDriver=official"
          ./gradlew :playwright-java-contract-tests:upstreamTestKnownLimitations -Pplaywright4j.browser=firefox -Pplaywright4j.browserChannel=moz-firefox -PtmpStreams=true $extra --tests '*TestBrowserTypeConnect.setInputFilesShouldPreserveLastModifiedTimestamp' --tests '*TestBrowserContextHar.shouldGoBackToRedirectedNavigation' --no-daemon || true
