name: Known Limitations Audit

# Non-blocking audit: runs the full upstream compatibility suite and checks that only the
# documented known-limitation reds fail. It is NOT the release gate (that is the Chrome/Edge
# smokes in release.yml) — this suite is heavy and environment-sensitive on the standard
# runner, so here it runs on demand / after a release and never blocks anything. It always
# uploads the test reports so results can be inspected.
on:
  workflow_dispatch:
  release:
    types: [ published ]

jobs:
  known-limitations-audit:
    runs-on: windows-2022
    timeout-minutes: 75

    env:
      BROWSER: chromium
      BROWSER_CHANNEL: chrome
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # Green iff exactly the six documented known-limitation reds fail; red on any new red or a
      # vanished known red. Non-blocking (continue-on-error) — this is an audit, not a gate. The
      # raw upstreamTest stays honest (no excludes); this evaluates the JUnit XMLs. See problems.md.
      - name: Run known-limitations audit (non-blocking)
        id: audit
        continue-on-error: true
        shell: pwsh
        run: ./gradlew.bat :playwright-java-contract-tests:knownLimitationsCheck --no-daemon --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright4j-test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
