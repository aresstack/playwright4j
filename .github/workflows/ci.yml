name: CI

# Fast gate for every push / PR: compile + a tiny per-channel smoke for Chrome and Edge.
# The heavy end-to-end knownLimitationsCheck runs ONLY on a published release (see
# known-limitations-check.yml), not here.
on:
  push:
    branches: [ main, master, develop ]
  pull_request:

jobs:
  build-and-smoke:
    # Windows is the currently validated path (Chrome/Edge channel, pure JVM driver).
    runs-on: windows-2022
    timeout-minutes: 30

    env:
      BROWSER: chromium
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build (compile + assemble, no tests)
        shell: pwsh
        run: ./gradlew.bat assemble testClasses --no-daemon --stacktrace

      - name: Unit tests (playwright4j module)
        timeout-minutes: 10
        shell: pwsh
        run: ./gradlew.bat :playwright4j:test --no-daemon --stacktrace

      - name: Browser launch environment (setEnv)
        timeout-minutes: 10
        shell: pwsh
        run: ./gradlew.bat :playwright-java-contract-tests:launchEnvironmentTest --no-daemon --stacktrace

      - name: APIRequestContext proxy
        timeout-minutes: 10
        shell: pwsh
        run: ./gradlew.bat :playwright-java-contract-tests:apiRequestProxyTest --no-daemon --stacktrace

      - name: Chrome smoke (BROWSER_CHANNEL=chrome)
        shell: pwsh
        env:
          BROWSER_CHANNEL: chrome
        run: ./gradlew.bat :playwright-java-contract-tests:channelSmoke --no-daemon --stacktrace

      - name: Edge smoke (BROWSER_CHANNEL=msedge)
        shell: pwsh
        env:
          BROWSER_CHANNEL: msedge
        run: ./gradlew.bat :playwright-java-contract-tests:channelSmoke --rerun-tasks --no-daemon --stacktrace

      - name: BrowserType.connect against launch-server (chrome)
        timeout-minutes: 15
        shell: pwsh
        env:
          BROWSER_CHANNEL: chrome
        run: ./gradlew.bat :playwright-java-contract-tests:browserTypeConnectTest --no-daemon --stacktrace

      - name: BrowserType.connect against launch-server (msedge)
        timeout-minutes: 15
        shell: pwsh
        env:
          BROWSER_CHANNEL: msedge
        run: ./gradlew.bat :playwright-java-contract-tests:browserTypeConnectTest --rerun-tasks --no-daemon --stacktrace

      - name: Verify published jar contains no native binaries
        shell: pwsh
        run: |
          ./gradlew.bat :playwright4j:jar --no-daemon
          $jar = Get-ChildItem playwright4j/build/libs/playwright4j-*.jar | Where-Object { $_.Name -notmatch '(sources|javadoc)' } | Select-Object -First 1
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($jar.FullName)
          $bad = $zip.Entries | Where-Object { $_.FullName -match '(?i)(\.(exe|dll|so|dylib|jnilib)$|(^|/)node$)' } | ForEach-Object { $_.FullName }
          $zip.Dispose()
          if ($bad) { Write-Error ("Native binaries in $($jar.Name):`n" + ($bad -join "`n")); exit 1 }
          Write-Host "No native binaries in $($jar.Name)"

      - name: Publish to Maven local (consumer check input)
        shell: pwsh
        run: ./gradlew.bat :playwright4j:publishToMavenLocal "-Pversion=0.0.0-ci" --no-daemon --stacktrace

      - name: Consumer check — Gradle resolution (no Node driver, no native binaries in the jar)
        shell: pwsh
        run: ./gradlew.bat -p consumer-check checkConsumerDependencies "-Pplaywright4jVersion=0.0.0-ci" --no-daemon --stacktrace

      - name: Consumer check — Maven resolves the published POM (no Node driver)
        shell: pwsh
        run: mvn -B -f consumer-check/pom.xml verify "-Dplaywright4j.version=0.0.0-ci"

      - name: Consumer check — Spring Boot fat jar launches Chrome (driver classpath from nested jars)
        timeout-minutes: 10
        shell: pwsh
        run: |
          ./gradlew.bat -p consumer-check/spring-boot bootJar "-Pplaywright4jVersion=0.0.0-ci" --no-daemon --stacktrace
          java "-Dchannel=chrome" -jar consumer-check/spring-boot/build/libs/playwright4j-spring-boot-check.jar
          if ($LASTEXITCODE -ne 0) { Write-Error "Spring Boot consumer check failed ($LASTEXITCODE)"; exit 1 }

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright4j-ci-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**

  firefox-smoke:
    # Firefox over WebDriver BiDi (Playwright channel moz-firefox) using the Firefox that is
    # preinstalled on the windows-2022 image, and Camoufox (Firefox under another name, see
    # docs/camoufox.md) with the two WebDriver BiDi fixes applied by docs/camoufox/hotpatch_omni.py.
    # Each browser runs with and without playwright4j.bidi.nativeBehavior, one job per combination,
    # so a hang or failure names its combination and does not hold up the others. Separate from
    # build-and-smoke so Chrome/Edge stay an independent gate. The tests fail (never skip) without
    # the browser. launchPersistentContext() runs headed (the Windows launcher-process handoff).
    name: firefox-smoke (${{ matrix.browser }}, nativeBehavior=${{ matrix.nativeBehavior }})
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, camoufox]
        nativeBehavior: ["false", "true"]

    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS: "1"
      PLAYWRIGHT4J_REQUIRE_FIREFOX: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Locate installed Firefox (fail if missing)
        if: matrix.browser == 'firefox'
        shell: pwsh
        run: |
          $candidates = @(
            "$env:ProgramFiles\Mozilla Firefox\firefox.exe",
            "${env:ProgramFiles(x86)}\Mozilla Firefox\firefox.exe"
          )
          $exe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) {
            Write-Error "Firefox is not installed on this runner; the Firefox smoke cannot run."
            exit 1
          }
          (Get-Item $exe).VersionInfo.ProductVersion | ForEach-Object { Write-Host "Firefox $_ at $exe" }
          "FIREFOX_EXECUTABLE=$exe" >> $env:GITHUB_ENV

      # Camoufox (Firefox under another name, see docs/camoufox.md) with the two WebDriver BiDi fixes:
      # the script pins the release, checks the archive and both changed files.
      - name: Install Camoufox (pinned, with the WebDriver BiDi fixes)
        if: matrix.browser == 'camoufox'
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\camoufox"
          python docs/camoufox/hotpatch_omni.py --install $dir
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "CAMOUFOX_EXECUTABLE=$dir\camoufox.exe" >> $env:GITHUB_ENV
          "FIREFOX_EXECUTABLE=$dir\camoufox.exe" >> $env:GITHUB_ENV

      - name: Firefox smoke (moz-firefox, WebDriver BiDi)
        shell: pwsh
        run: ./gradlew.bat :playwright-java-contract-tests:firefoxSmoke "-Pplaywright4j.bidi.nativeBehavior=${{ matrix.nativeBehavior }}" --no-daemon --stacktrace

      # CAMOU_CONFIG from setEnv, and one native window on the persistent start (#34).
      - name: Camoufox fingerprint smoke
        if: matrix.browser == 'camoufox'
        shell: pwsh
        env:
          CAMOUFOX_BIDI_FIXES: "true"
          PLAYWRIGHT4J_REQUIRE_CAMOUFOX: "true"
        run: ./gradlew.bat :playwright-java-contract-tests:camoufoxSmoke "-Pplaywright4j.bidi.nativeBehavior=${{ matrix.nativeBehavior }}" --no-daemon --stacktrace

      - name: Show failed Firefox tests
        if: failure()
        shell: pwsh
        run: |
          $results = "playwright-java-contract-tests/build/test-results/firefoxSmoke", "playwright-java-contract-tests/build/test-results/camoufoxSmoke"
          Get-ChildItem $results -Filter *.xml -ErrorAction SilentlyContinue | ForEach-Object {
            [xml]$xml = Get-Content $_.FullName -Raw
            foreach ($case in $xml.testsuite.testcase) {
              foreach ($problem in @($case.failure) + @($case.error)) {
                if ($problem -is [System.Xml.XmlElement]) {
                  Write-Host "=== $($case.classname) > $($case.name)"
                  Write-Host $problem.InnerText
                }
              }
            }
          }

      - name: Report leftover browser processes
        if: always()
        shell: pwsh
        run: |
          $left = Get-CimInstance Win32_Process -Filter "Name='firefox.exe' OR Name='camoufox.exe'"
          if ($left) {
            $left | Format-List Name, ProcessId, ParentProcessId, CreationDate, CommandLine
            $left | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          }
          else { Write-Host "No Firefox or Camoufox processes left." }

      - name: Upload Firefox smoke reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright4j-firefox-smoke-reports-${{ matrix.browser }}-nativeBehavior-${{ matrix.nativeBehavior }}
          path: |
            playwright-java-contract-tests/build/reports/tests/firefoxSmoke/**
            playwright-java-contract-tests/build/test-results/firefoxSmoke/**
            playwright-java-contract-tests/build/reports/tests/camoufoxSmoke/**
            playwright-java-contract-tests/build/test-results/camoufoxSmoke/**
