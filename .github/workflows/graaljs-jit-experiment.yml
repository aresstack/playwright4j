name: GraalJS JIT experiment

# Measures the Camoufox firefoxSmoke (nativeBehavior=true) on the same commit with the GraalJS
# interpreter (Temurin 21, Truffle fallback runtime) and with runtime compilation (Oracle GraalVM 21).
# All jobs start together so both variants share the same runner pool and time window.
on:
  push:
    branches: [ claude/project-thread-m5yk20 ]
  workflow_dispatch:

jobs:
  measure:
    name: ${{ matrix.jdk }} run ${{ matrix.run }}
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        jdk: [temurin, graalvm]
        run: [1, 2, 3]

    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS: "1"
      PLAYWRIGHT4J_REQUIRE_FIREFOX: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: ${{ matrix.jdk }}
          java-version: "21"
          cache: gradle

      - name: Install Camoufox (pinned, with the WebDriver BiDi fixes)
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\camoufox"
          python docs/camoufox/hotpatch_omni.py --install $dir
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "FIREFOX_EXECUTABLE=$dir\camoufox.exe" >> $env:GITHUB_ENV

      - name: Build test classes
        shell: pwsh
        run: ./gradlew.bat :playwright-java-contract-tests:testClasses --no-daemon

      - name: Firefox smoke (Camoufox, nativeBehavior=true)
        shell: pwsh
        run: |
          java -version
          $start = Get-Date
          ./gradlew.bat :playwright-java-contract-tests:firefoxSmoke "-Pplaywright4j.bidi.nativeBehavior=true" --no-daemon *>&1 | Tee-Object smoke.log
          $code = $LASTEXITCODE
          $secs = [int]((Get-Date) - $start).TotalSeconds
          $fallback = (Select-String -Path smoke.log -SimpleMatch "fallback runtime").Count
          Write-Host "RESULT jdk=${{ matrix.jdk }} run=${{ matrix.run }} exit=$code seconds=$secs fallbackWarnings=$fallback"
          exit $code

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jit-${{ matrix.jdk }}-${{ matrix.run }}
          path: |
            smoke.log
            playwright-java-contract-tests/build/test-results/firefoxSmoke/**
