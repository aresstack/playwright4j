plugins {
    id 'java'
}

description = 'Non-published contract tests for the official Playwright Java API against the playwright4j driver replacement.'

ext.upstreamPlaywrightVersion = findProperty('upstreamPlaywrightVersion') ?: '1.62.0'
ext.microsoftPlaywrightJavaRepository = 'https://github.com/microsoft/playwright-java'
ext.upstreamPlaywrightJavaRepository = microsoftPlaywrightJavaRepository
ext.upstreamPlaywrightTestsZipUrl = findProperty('playwrightJavaTestsZipUrl') ?: "${upstreamPlaywrightJavaRepository}/archive/refs/tags/v${upstreamPlaywrightVersion}.zip"

sourceSets {
    upstreamTest {
        java.srcDir 'src/upstreamTest/java'
        resources.srcDir 'src/upstreamTest/resources'
        compileClasspath += sourceSets.test.output + sourceSets.test.compileClasspath
        runtimeClasspath += output + compileClasspath + sourceSets.test.runtimeClasspath
    }
}

configurations {
    upstreamTestImplementation.extendsFrom testImplementation
    upstreamTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    testImplementation project(':playwright4j')
    testImplementation("com.microsoft.playwright:playwright:${upstreamPlaywrightVersion}") {
        exclude group: 'com.microsoft.playwright', module: 'driver'
        exclude group: 'com.microsoft.playwright', module: 'driver-bundle'
    }

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.13.1'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.13.1'
    testImplementation 'org.java-websocket:Java-WebSocket:1.6.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.13.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.13.1'
}

test {
    systemProperty 'playwright4j.officialApiSpike', findProperty('playwright4j.officialApiSpike') ?: 'false'
    systemProperty 'playwright4j.chrome.executablePath', findProperty('playwright4j.chrome.executablePath') ?: ''
}

// Tiny per-channel smoke (launch -> newPage -> setContent -> evaluate 1+1 -> close) against the
// playwright4j driver. Channel via -Pplaywright4j.browserChannel or BROWSER_CHANNEL env (chrome/msedge).
// Used by the push/PR CI to prove Chrome and Edge work without a full sweep.
tasks.register('channelSmoke', Test) {
    description = 'Minimal launch/evaluate/close smoke for the configured BROWSER_CHANNEL (chrome/msedge).'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter { includeTestsMatching 'com.aresstack.playwright4j.smoke.BrowserChannelSmokeTest' }

    environment 'BROWSER', 'chromium'
    environment 'BROWSER_CHANNEL', findProperty('playwright4j.browserChannel') ?: (System.getenv('BROWSER_CHANNEL') ?: 'chrome')
    environment 'PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD', '1'
    environment 'PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS', '1'

    systemProperty 'playwright4j.chrome.executablePath', findProperty('playwright4j.chrome.executablePath') ?: ''
    systemProperty 'junit.jupiter.execution.timeout.default', '90 s'
    systemProperty 'junit.jupiter.execution.timeout.thread.mode.default', 'SAME_THREAD'
    // An unhandled promise rejection or uncaught exception in the GraalJS driver (or launch-server)
    // terminates it with exit code 1, as Node.js would, instead of only being reported on stderr.
    systemProperty 'playwright4j.unhandledRejections', findProperty('playwright4j.unhandledRejections') ?: 'strict'
    testLogging { events "passed", "failed", "skipped"; showStandardStreams = true; exceptionFormat "full" }
}

// Firefox over WebDriver BiDi (moz-firefox channel) against an installed Firefox. Point
// FIREFOX_EXECUTABLE at the firefox binary; PLAYWRIGHT4J_REQUIRE_FIREFOX=true fails instead of skipping.
tasks.register('firefoxSmoke', Test) {
    description = 'Launch/evaluate/close smoke for an installed Firefox via WebDriver BiDi (moz-firefox).'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching 'com.aresstack.playwright4j.smoke.FirefoxBiDiSmokeTest'
        // Counts the real Firefox windows (EnumWindows on Windows, xdotool on Linux/X11).
        includeTestsMatching 'com.aresstack.playwright4j.smoke.FirefoxPersistentWindowTest'
        includeTestsMatching 'com.aresstack.playwright4j.smoke.FirefoxNativeBehaviorTest'
        includeTestsMatching 'com.aresstack.playwright4j.smoke.FirefoxCacheBehaviorTest'
        includeTestsMatching 'com.aresstack.playwright4j.smoke.FirefoxMainWorldTest'
        // Reading a page leaves no user activation, Playwright events or DOM changes (#37, #38, #40).
        includeTestsMatching 'com.aresstack.playwright4j.smoke.FirefoxReadSideEffectsTest'
        // Mouse paths and click timing under playwright4j.bidi.naturalPointer (#43).
        includeTestsMatching 'com.aresstack.playwright4j.smoke.FirefoxNaturalPointerTest'
        includeTestsMatching 'com.aresstack.playwright4j.smoke.FirefoxBidiTest'
    }

    environment 'PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD', '1'
    environment 'PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS', '1'
    // Firefox inherits it: on a Wayland desktop it opens X11 (XWayland) windows xdotool can count.
    environment 'MOZ_ENABLE_WAYLAND', '0'

    systemProperty 'junit.jupiter.execution.timeout.default', '90 s'
    systemProperty 'junit.jupiter.execution.timeout.thread.mode.default', 'SAME_THREAD'
    // An unhandled promise rejection or uncaught exception in the GraalJS driver (or launch-server)
    // terminates it with exit code 1, as Node.js would, instead of only being reported on stderr.
    systemProperty 'playwright4j.unhandledRejections', findProperty('playwright4j.unhandledRejections') ?: 'strict'
    // -Pplaywright4j.bidi.nativeBehavior=true runs the smoke with Firefox's own behaviour (docs/browser-signals.md).
    if (findProperty('playwright4j.bidi.nativeBehavior')) {
        systemProperty 'playwright4j.bidi.nativeBehavior', findProperty('playwright4j.bidi.nativeBehavior')
    }
    // Full exception text in the console: the CI log is often the only place a failure is seen.
    testLogging { events "passed", "failed", "skipped"; showStandardStreams = true; exceptionFormat "full" }
}

// Camoufox over WebDriver BiDi (moz-firefox channel): its fingerprint configuration
// (CAMOU_CONFIG_1..n) reaches the browser through setEnv. Opt-in: CAMOUFOX_EXECUTABLE;
// CAMOUFOX_BIDI_FIXES=true also checks a second page. See docs/camoufox.md.
tasks.register('camoufoxSmoke', Test) {
    description = 'Checks that a Camoufox fingerprint configuration passed with setEnv applies (WebDriver BiDi).'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter { includeTestsMatching 'com.aresstack.playwright4j.smoke.CamoufoxFingerprintTest' }
    outputs.upToDateWhen { false }

    environment 'PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD', '1'
    environment 'PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS', '1'
    environment 'MOZ_ENABLE_WAYLAND', '0'

    systemProperty 'junit.jupiter.execution.timeout.default', '120 s'
    systemProperty 'junit.jupiter.execution.timeout.thread.mode.default', 'SAME_THREAD'
    systemProperty 'playwright4j.unhandledRejections', findProperty('playwright4j.unhandledRejections') ?: 'strict'
    // -Pplaywright4j.bidi.nativeBehavior=true runs the smoke with Firefox's own behaviour (docs/browser-signals.md).
    if (findProperty('playwright4j.bidi.nativeBehavior')) {
        systemProperty 'playwright4j.bidi.nativeBehavior', findProperty('playwright4j.bidi.nativeBehavior')
    }
    testLogging { events "passed", "failed", "skipped"; showStandardStreams = true; exceptionFormat "full" }
}

// A manual Camoufox session over WebDriver BiDi for comparing with Camoufox's own launcher, see
// docs/camoufox.md. Runs only with CAMOUFOX_MANUAL=true; waits until the browser window is closed.
tasks.register('camoufoxManual', Test) {
    description = 'Opens Camoufox over WebDriver BiDi with given launch options and waits until its window is closed.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
