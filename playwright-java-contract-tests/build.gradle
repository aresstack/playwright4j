plugins {
    id 'java'
}

description = 'Non-published contract tests for the official Playwright Java API against the playwright4j driver replacement.'

ext.upstreamPlaywrightVersion = findProperty('upstreamPlaywrightVersion') ?: '1.59.0'
ext.microsoftPlaywrightJavaRepository = 'https://github.com/microsoft/playwright-java'
// ext.playwrightJavaForkRepository = 'https://github.com/Miguel0888/playwright-java'
ext.upstreamPlaywrightJavaRepository = microsoftPlaywrightJavaRepository
ext.upstreamPlaywrightTestsZipUrl = findProperty('playwrightJavaTestsZipUrl') ?: "${upstreamPlaywrightJavaRepository}/archive/refs/tags/v${upstreamPlaywrightVersion}.zip"

sourceSets {
    upstreamTest {
        java.srcDir 'src/upstreamTest/java'
        resources.srcDir 'src/upstreamTest/resources'
        compileClasspath += sourceSets.test.output + sourceSets.test.compileClasspath
        runtimeClasspath += output + compileClasspath + sourceSets.test.runtimeClasspath
    }
}

configurations {
    upstreamTestImplementation.extendsFrom testImplementation
    upstreamTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    testImplementation project(':playwright4j')
    testImplementation("com.microsoft.playwright:playwright:${upstreamPlaywrightVersion}") {
        exclude group: 'com.microsoft.playwright', module: 'driver'
        exclude group: 'com.microsoft.playwright', module: 'driver-bundle'
    }

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.13.1'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.13.1'
    testImplementation 'org.java-websocket:Java-WebSocket:1.6.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.13.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.13.1'
}

test {
    systemProperty 'playwright4j.officialApiSpike', findProperty('playwright4j.officialApiSpike') ?: 'false'
    systemProperty 'playwright4j.chrome.executablePath', findProperty('playwright4j.chrome.executablePath') ?: ''
}

tasks.named('processUpstreamTestResources') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    // The upstream Server serves files via getResourceAsStream("resources" + path), i.e. it
    // expects test assets under a `resources/` directory on the classpath. Nest them there.
    eachFile { details ->
        details.relativePath = new RelativePath(true,
                (['resources'] + (details.relativePath.segments as List)) as String[])
    }
    includeEmptyDirs = false
}

// Many upstream tests reference fixtures via the relative path `src/test/resources/...`
// (e.g. setInputFiles(Paths.get("src/test/resources/file-to-upload.txt")) and file:// URLs
// built from such paths). Our fixtures live under src/upstreamTest/resources, so we mirror
// them into a dedicated working directory laid out as `<cwd>/src/test/resources/...` and run
// the upstream tests from there. This keeps the fix inside the contract-test harness without
// touching the driver or rewriting upstream tests.
def upstreamTestCwd = layout.buildDirectory.dir('upstreamTestCwd')

tasks.register('syncUpstreamTestCwd', Copy) {
    description = 'Mirrors upstream test fixtures to <cwd>/src/test/resources for relative-path access.'
    from 'src/upstreamTest/resources'
    into upstreamTestCwd.map { it.dir('src/test/resources') }
}

tasks.register('upstreamTest', Test) {
    description = 'Runs imported official Microsoft Playwright Java upstream tests against the playwright4j driver replacement.'
    group = 'verification'
    testClassesDirs = sourceSets.upstreamTest.output.classesDirs
    classpath = sourceSets.upstreamTest.runtimeClasspath
    shouldRunAfter test

    // Run from a working directory where relative `src/test/resources/...` paths resolve.
    dependsOn 'syncUpstreamTestCwd'
    workingDir = upstreamTestCwd.get().asFile

    // Drive the official Microsoft test fixture onto the locally installed Chrome via the
    // standard Playwright browser-channel mechanism instead of a downloaded browser.
    environment 'BROWSER', 'chromium'
    environment 'BROWSER_CHANNEL', findProperty('playwright4j.browserChannel') ?: 'chrome'
    environment 'PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD', '1'
    environment 'PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS', '1'

    systemProperty 'playwright4j.debug', findProperty('playwright4j.debug') ?: 'false'
    systemProperty 'playwright4j.chrome.executablePath', findProperty('playwright4j.chrome.executablePath') ?: ''

    // Safety net: a single driver call that never returns (e.g. an unsupported HAR/zip export
    // during BrowserContext.close()) must not wedge the whole forked JVM. A generous per-method
    // JUnit timeout interrupts such a hang so the suite proceeds to @AfterAll, closes Playwright,
    // and the driver child receives EOF and shuts down (killing Chrome). Well above any legitimate
    // test duration, so it never affects green tests. Same-thread mode keeps Playwright's
    // single-threaded affinity intact.
    systemProperty 'junit.jupiter.execution.timeout.default', findProperty('playwright4j.testTimeout') ?: '90 s'
    systemProperty 'junit.jupiter.execution.timeout.thread.mode.default', 'SAME_THREAD'

    testLogging {
        events "passed", "failed", "skipped"
        showStandardStreams = false
    }
}

tasks.register('syncUpstreamPlaywrightJavaTests') {
    description = 'Imports all upstream Playwright Java tests into src/upstreamTest.'
    group = 'verification'

    doLast {
        def tempRoot = layout.buildDirectory.dir('tmp/upstream-playwright-java-tests').get().asFile
        def zipFile = new File(tempRoot, 'playwright-java.zip')
        def extractRoot = new File(tempRoot, 'extract')
        def targetJava = file('src/upstreamTest/java')
        def targetResources = file('src/upstreamTest/resources')

        delete tempRoot
        mkdir tempRoot

        logger.lifecycle("Fetching ${upstreamPlaywrightTestsZipUrl}")
        ant.get(src: upstreamPlaywrightTestsZipUrl, dest: zipFile, skipexisting: false)

        copy {
            from zipTree(zipFile)
            into extractRoot
        }

        def repoDir = extractRoot.listFiles().find { it.directory }
        if (repoDir == null) {
            throw new GradleException("Could not find extracted repository directory under ${extractRoot}")
        }

        def sourceTestRoot = new File(repoDir, 'playwright/src/test')
        def sourceJava = new File(sourceTestRoot, 'java')
        def sourceResources = new File(sourceTestRoot, 'resources')

        if (!sourceJava.directory) {
            throw new GradleException("Could not find upstream test sources at ${sourceJava}")
        }

        delete targetJava
        copy {
            from sourceJava
            into targetJava
        }

        delete targetResources
        if (sourceResources.directory) {
            copy {
                from sourceResources
                into targetResources
            }
        }

        def javaCount = fileTree(targetJava).matching { include '**/*.java' }.files.size()
        def resourceCount = targetResources.directory ? fileTree(targetResources).files.size() : 0
        logger.lifecycle("Imported upstream Playwright Java tests. Java files: ${javaCount}, resource files: ${resourceCount}")
    }
}
