plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
}

// group/version come from the root project (allprojects); version is overridable via -Pversion
// for the Maven Central release (see root build.gradle and .github/workflows/release.yml).

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
    withJavadocJar()
}

tasks.named('javadoc') {
    options.addStringOption('Xdoclint:none', '-quiet')
}


dependencies {
    api 'org.graalvm.polyglot:polyglot:25.0.0'
    api 'org.graalvm.polyglot:js:25.0.0'
    runtimeOnly 'com.microsoft.playwright:driver-bundle:1.59.0'

    // Java-backed video encoding (default backend for the intercepted ffmpeg spawn).
    implementation 'org.jcodec:jcodec:0.2.5'
    implementation 'org.jcodec:jcodec-javase:0.2.5'

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.13.1'
    testImplementation 'com.microsoft.playwright:playwright:1.59.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.13.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.13.1'
    testRuntimeOnly 'com.microsoft.playwright:driver-bundle:1.59.0'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Build the native node.exe compatibility launcher (see src/main/native/node-launcher.c and
// Driver.driverDir()). Windows + a MinGW-w64 gcc only; elsewhere the resource is simply absent and
// Driver reports a clear error if a test actually needs it. The launcher is a tiny standalone PE
// (KERNEL32 + msvcrt only) that re-execs the Java GraalJS driver in --node-compat mode.
def nodeLauncherOutputDir = layout.buildDirectory.dir('generated/node-launcher')
def nodeLauncherResourcePath = 'com/aresstack/playwright4j/launcher/node.exe'

static def findMingwGcc() {
    def candidates = [
            'C:\\msys64\\mingw64\\bin\\x86_64-w64-mingw32-gcc.exe',
            'C:\\msys64\\mingw64\\bin\\gcc.exe',
            'x86_64-w64-mingw32-gcc',
            'gcc'
    ]
    for (candidate in candidates) {
        try {
            def probe = new ProcessBuilder(candidate, '--version').redirectErrorStream(true).start()
            probe.inputStream.text
            if (probe.waitFor() == 0) {
                return candidate
            }
        } catch (ignored) {
        }
    }
    return null
}

tasks.register('compileNodeLauncher') {
    description = 'Compiles the native node.exe compatibility launcher (Windows/MinGW only).'
    def source = file('src/main/native/node-launcher.c')
    def outputExe = nodeLauncherOutputDir.get().file(nodeLauncherResourcePath).asFile
    inputs.file(source)
    outputs.file(outputExe)
    onlyIf {
        System.getProperty('os.name', '').toLowerCase().contains('win') && findMingwGcc() != null
    }
    doLast {
        def gcc = findMingwGcc()
        outputExe.parentFile.mkdirs()
        def process = new ProcessBuilder(gcc, '-O2', '-s', '-o', outputExe.absolutePath, source.absolutePath)
                .redirectErrorStream(true).start()
        def output = process.inputStream.text
        def code = process.waitFor()
        if (code != 0) {
            throw new GradleException("node.exe launcher compile failed (${gcc}, exit ${code}):\n${output}")
        }
        logger.lifecycle("Built node.exe launcher via ${gcc} -> ${outputExe}")
    }
}

sourceSets.main.resources.srcDir(nodeLauncherOutputDir)
tasks.named('processResources') { dependsOn('compileNodeLauncher') }

// withSourcesJar() includes the resources source dirs, which now contains the generated
// node-launcher output dir; declare the dependency and keep the compiled launcher binary out of
// the -sources jar (it belongs only in the main jar).
tasks.named('sourcesJar') {
    dependsOn('compileNodeLauncher')
    exclude 'com/aresstack/playwright4j/launcher/**'
}

test {
    useJUnitPlatform()
    systemProperty 'playwright4j.chromeSpike', findProperty('playwright4j.chromeSpike') ?: 'false'
    systemProperty 'playwright4j.graalChromeSpike', findProperty('playwright4j.graalChromeSpike') ?: 'false'
    systemProperty 'playwright4j.chrome.executablePath', findProperty('playwright4j.chrome.executablePath') ?: ''
    systemProperty 'playwright4j.chrome.headless', findProperty('playwright4j.chrome.headless') ?: 'false'
    systemProperty 'playwright4j.chrome.url', findProperty('playwright4j.chrome.url') ?: 'data:text/html,<title>Playwright4J Chrome Spike</title><h1>Playwright4J Chrome Spike</h1>'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            pom {
                name = 'playwright4j'
                description = 'Experimental Java/GraalVM runtime that runs the official Microsoft Playwright Core driver inside the JVM (Chromium: Chrome/Edge), without a Node.js runtime process.'
                url = 'https://github.com/aresstack/playwright4j'
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                developers {
                    developer {
                        id = 'aresstack'
                        name = 'AresStack'
                    }
                }
                scm {
                    connection = 'scm:git:https://github.com/aresstack/playwright4j.git'
                    developerConnection = 'scm:git:ssh://git@github.com:aresstack/playwright4j.git'
                    url = 'https://github.com/aresstack/playwright4j'
                }
            }
        }
    }
}

signing {
    def signingKey = findProperty('signingInMemoryKey')
    def signingPassword = findProperty('signingInMemoryKeyPassword')
    required { gradle.taskGraph.allTasks.any { it.name.toLowerCase().contains('centralportal') || it.name == 'publishAggregationToCentralPortal' } }
    if (signingKey) {
        useInMemoryPgpKeys(signingKey, signingPassword)
    }
    sign publishing.publications.mavenJava
}
